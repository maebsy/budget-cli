name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    env:
      UV_LOCKED: 1  # uv.lock 과 pyproject.toml 이 어긋나면 모든 uv 명령이 실패
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      # setup-uv 가 matrix 의 Python 을 설치한다 (.python-version 보다 우선). 외부 의존성은 없다.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run python -m unittest discover -s tests -t . -v
      - name: Run demo scenario
        if: runner.os == 'Linux'
        run: bash examples/demo.sh
